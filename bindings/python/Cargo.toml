[workspace]

[package]
name = "gliph2rs-python"
version = "0.1.0"
edition = "2021"
publish = false
description = "Python bindings for gliph2-rs"
license = "MIT"
repository = "https://github.com/mayankgandhi13/gliph2-rs"

[lib]
name = "_gliph2rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
gliph2-rs = { path = "../.." }
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
